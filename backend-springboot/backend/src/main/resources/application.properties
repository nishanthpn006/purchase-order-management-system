server.port=5000

spring.datasource.url=jdbc:postgresql://localhost:5432/purchase_order_db?currentSchema=public
spring.datasource.username=postgres
spring.datasource.password=nishanth@123

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Explicitly set the default schema so Hibernate always qualifies queries to public
spring.jpa.properties.hibernate.default_schema=public

# JWT Configuration
jwt.secret=poms-super-secret-key-for-jwt-signing-must-be-at-least-256-bits-long
jwt.expiration=86400000

# Disable Spring Security auto-generated password
spring.security.user.name=disabled
spring.security.user.password=disabled
